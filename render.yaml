databases:
  - name: walks-db
    databaseName: walks
    user: walks
    plan: free

services:
  - type: web
    name: walks-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: walks-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://localhost,capacitor://localhost
    healthCheckPath: /healthz