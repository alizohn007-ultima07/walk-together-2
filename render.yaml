databases:
  - name: walks-db
    databaseName: walks
    user: walks
    plan: free

services:
  # Бэкенд (FastAPI)
  - type: web
    name: walks-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: walks-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://walks-frontend.onrender.com,http://localhost:5173,capacitor://localhost
    healthCheckPath: /healthz

  # Фронтенд (статический сайт)
  - type: web
    name: walks-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://walks-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html